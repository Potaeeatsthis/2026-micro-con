# firmware-ci - checks every PR into master before it can be merged.
#
#   build (Debug), build (Release)  RoboticArmMain compiles and links with the settings in .cproject,
#                                   fits in flash/RAM, DMA buffers in the non-cacheable region,
#                                   no new warnings in App/
#   host-tests                      safety / motion / modes / voice-mode logic tests on a PC (gcc)
#   repo-rules                      project rules a build cannot see (ProjectDevGuide/ci/check_rules.py)
#
# Run the same checks locally before pushing (from the repo root):
#   python3 ProjectDevGuide/ci/build_firmware.py
#   sh ProjectDevGuide/tests/host/run.sh
#   python3 ProjectDevGuide/ci/check_rules.py
#
# No path filters on purpose: a required check that is skipped stays "pending" and blocks the PR.
# The whole run takes about a minute. Every job has a time limit, so a hang fails fast instead of
# waiting GitHub's 6-hour default.

name: firmware-ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.config }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Install arm-none-eabi-gcc
        # ARM's official toolchain, downloaded once and then cached by the action (no Ubuntu apt mirror:
        # it stalled or failed on 23 and 27 Oct). 13.3.Rel1 = the GCC 13 generation CubeIDE 2.2 uses.
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'
      - run: arm-none-eabi-gcc --version | head -1
      - name: Build RoboticArmMain
        run: python3 ProjectDevGuide/ci/build_firmware.py RoboticArmMain --config ${{ matrix.config }}

  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run host tests
        run: sh ProjectDevGuide/tests/host/run.sh

  repo-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check project rules
        run: python3 ProjectDevGuide/ci/check_rules.py
